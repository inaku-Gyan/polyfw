config-version = "0.2.0"
min-polyfw-version = "0.2.0"

[config]
local-dependencies = ["shared/*"]

[config.vscode]
enabled = false

[platforms.board-a]
description = "board-A"
target = "thumbv7em-none-eabihf"
cpu = "cortex-m7"
chip = "STM32H723VGTx"
working-dir = "bsp/board-a"
target-dir = "target/firmware/board-a"

[platforms.board-b]
description = "board-B"
target = "thumbv7em-none-eabihf"
cpu = "cortex-m4"
chip = "STM32F407IG"
working-dir = "bsp/board-b"
target-dir = "target/firmware/board-b"

[firmwares.buzzer]
description = "Buzzer alert pattern"
platform = "board-a"
package = "buzzer"

[firmwares.screen]
description = "Screen dashboard layout"
platform = "board-b"
package = "screen"

[firmwares.led-1]
description = "Slow LED blink pattern"
platform = "board-a"
package = "led"
bin = "led-1"

[firmwares.led-2]
description = "Fast LED blink pattern"
platform = "board-a"
package = "led"
bin = "led-2"
