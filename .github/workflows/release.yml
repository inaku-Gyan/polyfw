name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: warn
      - name: Validate tag, version, schema and main ancestry
        id: tag
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "polyfw") | .version')
          test "$RELEASE_TAG" = "v$version"
          schema_id="https://raw.githubusercontent.com/inaku-Gyan/polyfw/v$version/assets/polyfw.schema.json"
          jq -e --arg id "$schema_id" '."$id" == $id' assets/polyfw.schema.json > /dev/null
          test "$(sed -n '/^#:schema https:/s/^#:schema //p' docs/configuration.md)" = "$schema_id"
          commit=$(git rev-parse HEAD)
          test "$commit" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$commit" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: warn
          target: ${{ matrix.target }}
      - name: Build, smoke-test and archive native binary
        run: |
          cargo build --release --locked --target "$RELEASE_TARGET"
          binary="target/$RELEASE_TARGET/release/plfw"
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          test "$("$binary" --version)" = "plfw $RELEASE_VERSION"
          "$binary" --help
          "$binary" schema > generated-schema.json
          diff -u <(jq -S . assets/polyfw.schema.json) <(jq -S . generated-schema.json)

          stage="polyfw-$RELEASE_TARGET"
          mkdir "$stage" dist
          cp "$binary" README.md CHANGELOG.md LICENSE "$stage/"
          cp -R docs "$stage/"
          rm -rf "$stage/docs/adr" "$stage/docs/research"
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -NonInteractive -Command \
              "Compress-Archive -LiteralPath '$stage' -DestinationPath 'dist/$stage.zip'"
          else
            tar -czf "dist/$stage.tar.gz" "$stage"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: warn
      - name: Verify the packaged crate without publishing
        run: cargo publish --dry-run --locked
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish verified source
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--latest)
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes \
            --title "$RELEASE_TAG" "${flags[@]}"
