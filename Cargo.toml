[package]
name = "polyfw"
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
description = "Build, check, flash and debug registered embedded Rust firmware"
readme = "README.md"
repository = "https://github.com/inaku-Gyan/polyfw"
license = "MIT"
keywords = ["cargo", "embedded", "firmware", "probe-rs"]
categories = ["command-line-utilities", "development-tools::build-utils", "embedded"]
exclude = [
    "AGENTS.md",
    "GLOSSARY.md",
    ".github/",
    "docs/adr/",
    "docs/research/",
    "dist/",
    "demos/",
    "tests/demos.rs",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:comfy-table", "dep:ctrlc", "dep:dialoguer"]

[[bin]]
name = "plfw"
path = "src/cli/main.rs"
required-features = ["cli"]

[dependencies]
cargo-config2 = "0.1.45"
clap = { version = "4.5", features = ["derive"], optional = true }
comfy-table = { version = "8.0", features = ["custom_styling"], optional = true }
ctrlc = { version = "3.5", optional = true }
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"], optional = true }
glob = "0.3"
schemars = "1.2"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[profile.dev]
debug = 0
